name: UC16 PHP CI

on:
  push:
    branches:
      - feature/uc16-mvc
    paths:
      - 'UC16_ThucHienXetTuyen/**'
      - '.github/workflows/uc16-php-ci.yml'
  pull_request:
    paths:
      - 'UC16_ThucHienXetTuyen/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UC16_ThucHienXetTuyen
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Check PHP syntax
        run: find app config public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run UC16 tests
        run: php tests/AdmissionServiceTest.php

